<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Lesen</title>
<style>
  body { font-family: Georgia, serif; font-size: 20px; line-height: 1.8;
         max-width: 700px; margin: 60px auto; padding: 0 20px; }
  #text { white-space: pre-wrap; }
  .word { cursor: pointer; }
  #paste { font-family: sans-serif; font-size: 16px; margin-bottom: 24px; }
  #paste summary { cursor: pointer; color: #555; }
  #paste textarea { display: block; box-sizing: border-box; width: 100%;
                    margin: 8px 0; font: 16px/1.5 Georgia, serif; padding: 8px; }
  #paste button { font-size: 15px; padding: 4px 12px; margin-right: 8px; }
  #paste .error { color: #b00; }
  .word:hover { background: #ffe; }
  .word.selected { background: #fe8; }
  /* Narrow windows: a bottom sheet that scrolls itself and never takes more
     than 45% of the screen; the page gets matching room below the text. */
  #panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 45vh;
           overflow-y: auto; box-sizing: border-box; background: #f6f6f6;
           border-top: 1px solid #ccc; font-family: sans-serif; font-size: 16px;
           line-height: 1.5; padding: 12px 20px; display: none; }
  #panel .inner { max-width: 700px; margin: 0 auto; position: relative; }
  #panel .close { position: absolute; top: -4px; right: 0; border: none;
                  background: none; font-size: 24px; color: #666; cursor: pointer; }
  #panel .word-text { font-size: 22px; font-weight: bold; padding-right: 30px; }
  #panel dl { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: 6px 0 0; }
  #panel dl div { display: flex; gap: 6px; }
  #panel dt { color: #666; }
  #panel dd { margin: 0; }
  /* Wide windows: the panel sits beside the text instead of over it. */
  @media (min-width: 1100px) {
    body { max-width: 1120px; }
    #layout { display: grid; grid-template-columns: minmax(0, 700px) 380px;
              gap: 40px; align-items: start; }
    #panel { position: sticky; top: 20px; max-height: calc(100vh - 40px);
             border: 1px solid #ccc; border-radius: 6px; }
  }
  #panel .model { margin-top: 10px; padding-top: 8px; border-top: 1px solid #ddd; }
  #panel .model .status { color: #666; font-style: italic; }
  #panel .model .error, #panel .mismatch { color: #b00; }
  #panel .model p { margin: 4px 0; }
</style>
</head>
<body>
<div id="layout">
  <main>
    <details id="paste">
      <summary>Paste your own text</summary>
      <textarea id="paste-text" rows="8" placeholder="Paste German text here"></textarea>
      <button id="read">Read</button>
      <button id="generated">Back to the generated text</button>
      <p class="error" id="paste-error"></p>
    </details>
    <h1 id="title"></h1>
    <div id="text"></div>
  </main>
  <aside id="panel"><div class="inner"></div></aside>
</div>
<script>
let text = '';
let tokens = [];
let selected = null;
let requestId = 0;

// The last pasted text is kept in this browser only, so a reload doesn't lose it.
const PASTED_KEY = 'lspeed.pastedText';
const storage = {
  get() { try { return localStorage.getItem(PASTED_KEY); } catch { return null; } },
  set(v) { try { localStorage.setItem(PASTED_KEY, v); } catch {} },
  clear() { try { localStorage.removeItem(PASTED_KEY); } catch {} },
};

function loadGenerated() {
  return fetch('/api/text').then(r => r.json()).then(data => render(data.title, data));
}

function loadPasted(raw) {
  return fetch('/api/tokenize', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: raw}),
  })
    .then(r => r.json().then(data => {
      if (!r.ok) throw new Error(data.detail || r.statusText);
      return data;
    }))
    .then(data => {
      storage.set(data.text);
      render('Your text', data);
    });
}

const saved = storage.get();
if (saved) {
  document.getElementById('paste-text').value = saved;
  loadPasted(saved).catch(loadGenerated);
} else {
  loadGenerated();
}

const pasteError = document.getElementById('paste-error');
document.getElementById('read').addEventListener('click', () => {
  pasteError.textContent = '';
  loadPasted(document.getElementById('paste-text').value)
    .then(() => { document.getElementById('paste').open = false; })
    .catch(err => { pasteError.textContent = 'Could not read the text: ' + err.message; });
});
document.getElementById('generated').addEventListener('click', () => {
  storage.clear();
  pasteError.textContent = '';
  document.getElementById('paste-text').value = '';
  document.getElementById('paste').open = false;
  loadGenerated();
});

function render(title, data) {
  closePanel();
  text = data.text;
  tokens = data.tokens;
  document.getElementById('title').textContent = title;
  const box = document.getElementById('text');
  box.replaceChildren();
  for (const t of tokens) {
    if (t.clickable) {
      const span = document.createElement('span');
      span.className = 'word';
      span.dataset.i = t.i;
      span.textContent = t.text;
      box.appendChild(span);
    } else {
      box.appendChild(document.createTextNode(t.text));
    }
    box.appendChild(document.createTextNode(t.ws));
  }
}

document.getElementById('text').addEventListener('click', e => {
  const span = e.target.closest('.word');
  if (!span) return;
  if (selected) selected.classList.remove('selected');
  selected = span;
  span.classList.add('selected');
  const t = tokens[span.dataset.i];
  showFacts(t);
  explainWord(t.i);
  span.scrollIntoView({block: 'nearest'});
});

// In bottom-sheet mode, give the page as much room below the text as the panel
// is tall, so the end of the text and the tapped word can be scrolled into view.
const panel = document.getElementById('panel');
new ResizeObserver(() => {
  const covering = getComputedStyle(panel).position === 'fixed' && panel.style.display !== 'none';
  const room = covering ? panel.offsetHeight + 'px' : '';
  document.body.style.paddingBottom = room;
  document.documentElement.style.scrollPaddingBottom = room;
}).observe(panel);

function closePanel() {
  panel.style.display = 'none';
  if (selected) selected.classList.remove('selected');
  selected = null;
  requestId++;  // drop any answer still on its way
  document.body.style.paddingBottom = '';
  document.documentElement.style.scrollPaddingBottom = '';
}

function explainWord(i) {
  // Only the latest tap's answer is shown; an earlier one arriving late is ignored.
  const id = ++requestId;
  setModel(el('p', 'Explaining…', 'status'));
  fetch('/api/explain', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text, i}),
  })
    .then(r => r.json().then(data => {
      if (!r.ok) throw new Error(data.detail || r.statusText);
      return data;
    }))
    .then(e => { if (id === requestId) showExplanation(e); })
    .catch(err => {
      if (id === requestId) setModel(el('p', 'Could not explain: ' + err.message, 'error'));
    });
}

function showExplanation(e) {
  const parts = [el('p', e.explanation)];
  if (e.rule) parts.push(el('p', 'Rule: ' + e.rule));
  if (e.governed_by) parts.push(el('p', 'Caused by: ' + e.governed_by));
  const facts = modelFacts(e);
  if (facts) parts.push(facts);
  if (e.mismatches.length) {
    parts.push(el('p', 'Disagrees with spaCy on: ' + e.mismatches.join(', '), 'mismatch'));
  }
  setModel(...parts);
}

// "Model says: Dat · Fem · Sing", with values that disagree with spaCy in red.
// A field the model left empty is shown as "no case" only when it disagrees.
function modelFacts(e) {
  const shown = ['case', 'gender', 'number'].filter(f => e[f] || e.mismatches.includes(f));
  if (!shown.length) return null;
  const p = el('p', 'Model says: ', 'status');
  shown.forEach((f, n) => {
    if (n) p.append(' · ');
    p.append(el('span', e[f] || 'no ' + f, e.mismatches.includes(f) ? 'mismatch' : ''));
  });
  return p;
}

function setModel(...children) {
  document.querySelector('#panel .model').replaceChildren(...children);
}

function el(tag, text, className) {
  const node = document.createElement(tag);
  node.textContent = text;
  if (className) node.className = className;
  return node;
}

function showFacts(t) {
  const rows = [['Lemma', t.lemma], ['Part of speech', t.pos]];
  for (const [k, v] of Object.entries(t.morph)) rows.push([k, v]);
  if (t.head !== t.i) rows.push(['Belongs to', tokens[t.head].text]);

  const inner = document.querySelector('#panel .inner');
  inner.replaceChildren();
  const close = el('button', '×', 'close');
  close.title = 'Close';
  close.addEventListener('click', closePanel);
  const title = el('div', t.text, 'word-text');
  const dl = document.createElement('dl');
  for (const [k, v] of rows) {
    const pair = document.createElement('div');
    pair.append(el('dt', k), el('dd', v));
    dl.append(pair);
  }
  const model = el('div', '', 'model');
  inner.append(close, title, dl, model);
  panel.style.display = 'block';
}
</script>
</body>
</html>
